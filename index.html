<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Imagen</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}
canvas {
  margin-top: 20px;
  max-width: 100%;
  border-radius: 10px;
}
button {
  background: #00c853;
  border: none;
  padding: 12px 20px;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>📸 Editor de Imagen</h2>

<p>Imagen base</p>
<input type="file" id="baseImage" accept="image/*">

<p>PNG (marca de agua)</p>
<input type="file" id="overlayImage" accept="image/png">

<br>
<button onclick="procesar()">Generar</button>

<br>
<canvas id="canvas"></canvas>

<br>
<button onclick="descargar()">⬇ Descargar</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function cargarImagen(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = URL.createObjectURL(file);
  });
}

async function procesar() {
  const baseFile = document.getElementById("baseImage").files[0];
  const overlayFile = document.getElementById("overlayImage").files[0];

  if (!baseFile || !overlayFile) {
    alert("Selecciona ambas imágenes");
    return;
  }

  // Esperar ambas imágenes correctamente
  const baseImg = await cargarImagen(baseFile);
  const overlayImg = await cargarImagen(overlayFile);

  // Ajustar canvas
  canvas.width = baseImg.width;
  canvas.height = baseImg.height;

  // Dibujar base
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(baseImg, 0, 0);

  // Calcular tamaño 10%
  const overlayWidth = baseImg.width * 0.1;
  const scale = overlayWidth / overlayImg.width;
  const overlayHeight = overlayImg.height * scale;

  // Posición (esquina superior derecha)
  const margin = 10;
  const x = baseImg.width - overlayWidth - margin;
  const y = margin;

  // Dibujar PNG
  ctx.drawImage(overlayImg, x, y, overlayWidth, overlayHeight);
}

function descargar() {
  const link = document.createElement("a");
  link.download = "imagen_editada.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
